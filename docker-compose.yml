services:
  postgres:
    image: postgres:16-alpine
    container_name: powrbridge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: powrbridge_pm
    volumes:
      - powrbridge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d powrbridge_pm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: powrbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - powrbridge_redis_data:/data

volumes:
  powrbridge_pg_data:
  powrbridge_redis_data:
